name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Create environment
        run: uv venv --python 3.13
      - name: Install test dependencies
        run: uv pip install -r requirements.txt
      - name: Run tests
        run: uv run pytest -q
